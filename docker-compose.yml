name: sabsepehle-ai

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sabsepehle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_strong_password}
      POSTGRES_DB: ${POSTGRES_DB:-sabsepehle_ai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Host-side port only — other containers on this network still reach it via
      # postgres:5432. Remapped from 5432 because another local project already
      # holds that host port.
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sabsepehle}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [sabsepehle]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-change_me_redis_password}"]
    volumes:
      - redis_data:/data
    ports:
      # Remapped from 6379 (another local project already holds that host port).
      # Unused by the app anyway while REDIS_URL in .env points at an external instance.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change_me_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [sabsepehle]

  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    healthcheck:
      # The qdrant image ships neither wget nor curl — use bash's /dev/tcp instead.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [sabsepehle]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    # DATABASE_URL / REDIS_URL / QDRANT_URL come from .env as the single source of
    # truth — by default they point at the bundled containers below (service names
    # postgres/redis/qdrant), but can be swapped for managed cloud instances without
    # touching this file.
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    ports:
      - "${API_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [sabsepehle]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:4000}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
    restart: unless-stopped
    env_file: .env
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    networks: [sabsepehle]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - web
      - api
    networks: [sabsepehle]

networks:
  sabsepehle:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
