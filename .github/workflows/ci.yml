name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  # Dummy values so config validation (env.validation.ts) passes during build/typecheck —
  # no real infra or secrets are needed to compile the app.
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
  REDIS_URL: "redis://localhost:6379"
  QDRANT_URL: "http://localhost:6333"
  JWT_SECRET: "ci_jwt_secret_placeholder_00000000"
  JWT_REFRESH_SECRET: "ci_jwt_refresh_secret_placeholder_0000"
  COOKIE_SECRET: "ci_cookie_secret_placeholder"

jobs:
  lint-typecheck-build:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma

      - name: Lint
        run: npx turbo run lint

      - name: Typecheck
        run: npx turbo run typecheck

      - name: Build
        run: npx turbo run build

  docker-build:
    name: Validate Docker images build
    runs-on: ubuntu-latest
    needs: lint-typecheck-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: sabsepehle-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: sabsepehle-web:ci
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:4000
            NEXT_PUBLIC_SOCKET_URL=http://localhost:4000
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
